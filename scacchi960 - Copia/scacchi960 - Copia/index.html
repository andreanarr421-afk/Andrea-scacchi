<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <div id="topBar">

        <div id="leftInfo">
            <div class="label">Turno</div>
            <div id="turnDisplay">Bianco</div>
        </div>

        <div id="centerInfo">
            <div id="statusDisplay">Partita iniziata</div>
        </div id="evaluationDisplay">0.0</div>
        </div>

        <div id="rightInfo">
            <button id="newGameBtn">Nuova Partita</button>
        </div>

    </div>

    <div id="gameArea">

        <div id="evaluationBar">
            <div id="evaluationFill"></div>
            <div id="evaluationScore">0.0</div>
        </div>


        <div id="boardWrapper">

            <div id="filesTop">
                <div>A</div><div>B</div><div>C</div><div>D</div>
                <div>E</div><div>F</div><div>G</div><div>H</div>
            </div>

            <div id="boardArea">

                <div id="ranksLeft">
                    <div>8</div><div>7</div><div>6</div><div>5</div>
                    <div>4</div><div>3</div><div>2</div><div>1</div>
                </div>

                <div id="board"></div>

                <div id="ranksRight">
                    <div>8</div><div>7</div><div>6</div><div>5</div>
                    <div>4</div><div>3</div><div>2</div><div>1</div>
                </div>

            </div>

            <div id="filesBottom">
                <div>A</div><div>B</div><div>C</div><div>D</div>
                <div>E</div><div>F</div><div>G</div><div>H</div>
            </div>

        </div>


    </div>

    <div id="movePanel">
        <div id="moveHeader">Storico Mosse</div>
        <div id="moveList"></div>
    </div>

</div>

<div id="promotionModal" class="hidden">

    <div id="promotionBox">

        <div id="promotionTitle">
            Scegli il pezzo
        </div>

        <div id="promotionChoices">
            <button class="promotionPiece" data-piece="q"></button>
            <button class="promotionPiece" data-piece="r"></button>
            <button class="promotionPiece" data-piece="b"></button>
            <button class="promotionPiece" data-piece="n"></button>
        </div>

    </div>

</div>

<script src="js/board.js"></script>
<script src="js/render.js"></script>
<script src="js/moveGenerator.js"></script>
<script src="js/rules.js"></script>

<!-- Motore IA -->
<script src="js/engine.js"></script>

<!-- Gioco -->
<script src="js/main.js"></script>

</body>
</html>
